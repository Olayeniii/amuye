name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]"

      - name: Install Node dependencies
        run: npm ci

      - name: Run Python tests
        run: python -m pytest -q

      - name: Typecheck ACP bridge
        run: npm run typecheck

      - name: Build execution console
        run: npm run build
