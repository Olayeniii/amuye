<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Amúyẹ protocol assessment execution console" />
    <title>Amúyẹ | Execution Console</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./readability.css" />
  </head>
  <body>
    <div id="app"><p class="loading">Loading verified execution evidence...</p></div>
    <script type="module" src="./app.js"></script>
    <script type="module" src="./runtime-fixes.js"></script>
    <script type="module" src="./demo-framing.js"></script>
    <script>
      const clarifyMemoryHeading = () => {
        document.querySelectorAll(".memory-panel h2").forEach((heading) => {
          if (heading.textContent === "Experience recalled from Sibyl") {
            heading.textContent = "Prior experience changed the plan";
          }
        });
        document.querySelectorAll(".brand img").forEach((logo) => {
          if (logo.getAttribute("src") !== "/assets/amuye-logo.png") {
            logo.setAttribute("src", "/assets/amuye-logo.png");
          }
        });
      };
      new MutationObserver(clarifyMemoryHeading).observe(document.querySelector("#app"), { childList: true, subtree: true });
      addEventListener("hashchange", clarifyMemoryHeading);
    </script>
  </body>
</html>
