[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amuye"
version = "0.1.0"
description = "A procurement agent that learns how to commission specialist work"
requires-python = ">=3.10"
dependencies = ["sibyl-memory-client==0.8.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
amuye = "amuye.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

